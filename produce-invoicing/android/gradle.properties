org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Office API base URL per flavor. Leave EMPTY in the repository: the app then
# shows "Office server: not configured" instead of guessing a host.
# Set per machine in ~/.gradle/gradle.properties or with -P on the command line, e.g.
#   ./gradlew assemblePilotDebug -Ppi.apiBaseUrl.pilot=https://invoicing-office.example.lan
# Never commit a real office IP/hostname here (CLAUDE.md invariant 15).
pi.apiBaseUrl.dev=
pi.apiBaseUrl.pilot=
